apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: shekel-frontend:local
          imagePullPolicy: Never
          command: ["npm", "run", "dev", "-w", "@shekel/root-config"]
          ports:
            - containerPort: 9000
          env:
            - name: API_PROXY_TARGET
              value: http://backend.shekel.svc.cluster.local
            - name: VITE_CATALOG_URL
              value: http://catalog.127.0.0.1.nip.io:8929/src/spa.tsx
            - name: VITE_CART_URL
              value: http://cart.127.0.0.1.nip.io:8929/src/spa.tsx
            - name: VITE_ACCOUNT_URL
              value: http://account.127.0.0.1.nip.io:8929/src/spa.tsx
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  ingressClassName: nginx
  rules:
    - host: shop.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
---
